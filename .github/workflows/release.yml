# Builds the release assets from a pushed v* tag in a clean environment,
# records build provenance for them, and opens a draft Release. Containers
# only see a release after it is reviewed and published by hand.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            printf 'Tag %s does not match package.json version %s\n' "$GITHUB_REF_NAME" "$version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm test
          bash tests/bootstrap.test.sh
          bash tests/launcher-modes.test.sh

      - name: Build
        run: npm run build

      - name: Package release assets
        run: |
          web_zip="ACLCloudFreeBotToolKit-web-${GITHUB_REF_NAME}.zip"
          mkdir release-assets
          cp dist/bootstrap.sh dist/launcher.sh dist/acl-renew-linux-amd64 release-assets/
          (cd dist && zip -qr "../release-assets/${web_zip}" index.html favicon.svg assets)
          (cd release-assets && sha256sum bootstrap.sh launcher.sh acl-renew-linux-amd64 "${web_zip}" > SHA256SUMS)
          cat release-assets/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=''
          case "$GITHUB_REF_NAME" in
            *-*) prerelease='--prerelease' ;;
          esac
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft $prerelease --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
